<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc mừng sinh nhật</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at center, #0b0b2a, #000000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: transparent;
            cursor: default;
        }
        /* lớp phủ chữ mờ phía trên canvas (không ảnh hưởng đến sao) */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .overlay h1 {
            font-size: clamp(2.5rem, 10vw, 5rem);
            color: rgba(255, 215, 0, 0.7);
            text-shadow: 0 0 30px #ffaa00, 0 0 60px #ff5500;
            letter-spacing: 4px;
            font-weight: bold;
            text-align: center;
            background: rgba(0,0,0,0.3);
            padding: 0.3em 1.2em;
            border-radius: 60px;
            backdrop-filter: blur(3px);
            border: 1px solid rgba(255,200,100,0.3);
            transform: rotate(-2deg);
            font-family: 'Segoe UI', cursive, sans-serif;
        }
        .overlay small {
            display: block;
            font-size: 0.4em;
            color: #ffdd99;
            text-shadow: 0 0 20px #ff8800;
            margin-top: 10px;
            letter-spacing: 6px;
        }
        @media (max-width: 600px) {
            .overlay h1 { font-size: 2.2rem; padding: 0.2em 0.8em; }
        }
    </style>
</head>
<body>

<div class="overlay">
    <h1>🎂 CHÚC MỪNG SINH NHẬT 🎂<br><small>✨ vạn điều tốt lành ✨</small></h1>
</div>

<canvas id="birthdayCanvas"></canvas>

<script>
    (function() {
        const canvas = document.getElementById('birthdayCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // ---------- THAM SỐ SAO THỔ (ở giữa) ----------
        const SATURN_RADIUS = Math.min(width, height) * 0.09;  // tự động co giãn
        const RING_RADIUS = SATURN_RADIUS * 1.7;
        const RING_WIDTH = SATURN_RADIUS * 0.5;
        const RING_TILT = 0.4; // độ nghiêng vành

        // ---------- QUỸ ĐẠO CÁC NGÔI SAO MÀU ----------
        const NUM_STARS = 160;
        const stars = [];

        // Tạo các ngôi sao màu sắc bay xung quanh
        function initStars() {
            for (let i = 0; i < NUM_STARS; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.min(width, height) * (0.25 + Math.random() * 0.45);
                const speed = 0.002 + Math.random() * 0.008;
                const size = 3 + Math.random() * 8;
                // màu sắc rực rỡ (HSL)
                const hue = Math.random() * 360;
                const sat = 80 + Math.random() * 20;
                const lig = 60 + Math.random() * 35;
                stars.push({
                    angle: angle,
                    radius: radius,
                    speed: speed,
                    size: size,
                    hue: hue,
                    sat: sat,
                    lig: lig,
                    phase: Math.random() * 100,
                });
            }
        }
        initStars();

        // Hàm vẽ sao thổ (phong cách đơn giản nhưng rõ vành)
        function drawSaturn(cx, cy, radius) {
            const tilt = RING_TILT;
            const ringR = radius * 1.7;
            const ringW = radius * 0.5;

            // ---- Vành đai chính (ellipse nghiêng) ----
            ctx.save();
            ctx.translate(cx, cy);
            // Vẽ vành trước (phần trước của sao)
            ctx.beginPath();
            ctx.ellipse(0, 0, ringR, ringR * (1 - tilt * 0.4), 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(210, 180, 140, 0.25)';
            ctx.fill();
            ctx.strokeStyle = '#d4b68a';
            ctx.lineWidth = ringW * 0.5;
            ctx.stroke();

            // Vành trong (sáng hơn)
            ctx.beginPath();
            ctx.ellipse(0, 0, ringR * 0.85, ringR * 0.85 * (1 - tilt * 0.35), 0, 0, Math.PI * 2);
            ctx.strokeStyle = '#e8c9a0';
            ctx.lineWidth = ringW * 0.3;
            ctx.stroke();

            // Vành ngoài mờ
            ctx.beginPath();
            ctx.ellipse(0, 0, ringR * 1.1, ringR * 1.1 * (1 - tilt * 0.45), 0, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(200, 170, 130, 0.3)';
            ctx.lineWidth = ringW * 0.4;
            ctx.stroke();

            // ---- Thân sao Thổ (hình cầu) ----
            const grad = ctx.createRadialGradient(-radius*0.3, -radius*0.3, radius*0.1, 0, 0, radius);
            grad.addColorStop(0, '#f5e6c4');
            grad.addColorStop(0.5, '#d4b48c');
            grad.addColorStop(0.9, '#8b6b4a');
            grad.addColorStop(1, '#4d3a2a');
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.shadowColor = '#ffbb77';
            ctx.shadowBlur = 35;
            ctx.fill();
            ctx.shadowBlur = 0;
            // viền sáng
            ctx.strokeStyle = '#ffe0b0';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // ---- Vành đai phía trước (chồng lên) ----
            ctx.beginPath();
            ctx.ellipse(0, 0, ringR, ringR * (1 - tilt * 0.4), 0, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(220, 190, 150, 0.6)';
            ctx.lineWidth = ringW * 0.6;
            ctx.stroke();

            // thêm ánh sáng lấp lánh cho vành
            for (let i = 0; i < 12; i++) {
                const a = (i / 12) * Math.PI * 2;
                const x = Math.cos(a) * ringR * 0.9;
                const y = Math.sin(a) * ringR * 0.9 * (1 - tilt * 0.4);
                ctx.beginPath();
                ctx.arc(x, y, 3 + Math.sin(a*3)*2, 0, Math.PI*2);
                ctx.fillStyle = `hsla(${40 + i*10}, 80%, 70%, 0.5)`;
                ctx.fill();
            }
            ctx.restore();
        }

        // Vẽ các ngôi sao màu sắc (xung quanh)
        function drawColorfulStars(time) {
            for (let s of stars) {
                // cập nhật góc
                s.angle += s.speed;
                // tính vị trí
                const x = centerX + Math.cos(s.angle) * s.radius;
                const y = centerY + Math.sin(s.angle) * s.radius * 0.85; // hơi dẹt để tạo chiều sâu
                // dao động kích thước nhẹ
                const pulse = 1 + 0.2 * Math.sin(time * 0.02 + s.phase);
                const size = s.size * pulse;

                // vẽ tia sáng (glow)
                const grad = ctx.createRadialGradient(x, y, 1, x, y, size * 2.5);
                grad.addColorStop(0, `hsla(${s.hue}, ${s.sat}%, ${s.lig}%, 1)`);
                grad.addColorStop(0.4, `hsla(${s.hue}, ${s.sat}%, ${s.lig}%, 0.7)`);
                grad.addColorStop(1, `hsla(${s.hue}, ${s.sat}%, ${s.lig}%, 0)`);
                ctx.beginPath();
                ctx.arc(x, y, size * 2.5, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // nhân sao chính (sáng)
                ctx.shadowColor = `hsl(${s.hue}, 100%, 70%)`;
                ctx.shadowBlur = 25;
                ctx.beginPath();
                ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${s.hue}, ${s.sat}%, ${s.lig}%)`;
                ctx.fill();
                ctx.shadowBlur = 0;

                // vẽ thêm tia nhỏ (hiệu ứng lấp lánh)
                for (let i = 0; i < 4; i++) {
                    const ang = i * Math.PI/2 + time * 0.01;
                    const dx = Math.cos(ang) * size * 1.2;
                    const dy = Math.sin(ang) * size * 1.2;
                    ctx.beginPath();
                    ctx.arc(x + dx, y + dy, size * 0.2, 0, Math.PI*2);
                    ctx.fillStyle = `hsla(${s.hue + 30}, 100%, 80%, 0.7)`;
                    ctx.fill();
                }
            }
        }

        // Vẽ thêm các hạt nhỏ li ti (nền)
        function drawDust(time) {
            for (let i = 0; i < 80; i++) {
                const a = i * 1.7 + time * 0.003;
                const r = Math.min(width, height) * (0.1 + 0.45 * Math.sin(i * 0.7 + 1));
                const x = centerX + Math.cos(a) * r;
                const y = centerY + Math.sin(a * 0.9) * r * 0.7;
                const s = 1 + Math.sin(i + time*0.01) * 1.2;
                ctx.beginPath();
                ctx.arc(x, y, s, 0, Math.PI*2);
                ctx.fillStyle = `hsla(${i*50 % 360}, 70%, 70%, 0.25)`;
                ctx.fill();
            }
        }

        // Animation loop
        let time = 0;
        function animate() {
            time++;
            ctx.clearRect(0, 0, width, height);

            // vẽ các sao màu trước (nền)
            drawDust(time);
            drawColorfulStars(time);

            // vẽ sao Thổ ở giữa (chồng lên trên)
            const satRad = Math.min(width, height) * 0.09;
            drawSaturn(centerX, centerY, satRad);

            // vẽ thêm hiệu ứng ánh sáng xung quanh sao Thổ
            const grad = ctx.createRadialGradient(centerX, centerY, satRad*0.8, centerX, centerY, satRad*2.5);
            grad.addColorStop(0, 'rgba(255, 200, 100, 0)');
            grad.addColorStop(0.5, 'rgba(255, 180, 80, 0.05)');
            grad.addColorStop(1, 'rgba(255, 100, 20, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, satRad*2.5, 0, Math.PI*2);
            ctx.fill();

            // vẽ các tia sáng xoay quanh sao Thổ (thêm sinh động)
            for (let i = 0; i < 20; i++) {
                const ang = i / 20 * Math.PI*2 + time * 0.005;
                const r = satRad * 1.1 + 20 * Math.sin(time*0.02 + i);
                const x = centerX + Math.cos(ang) * r;
                const y = centerY + Math.sin(ang) * r * 0.7;
                ctx.beginPath();
                ctx.arc(x, y, 3 + Math.sin(time*0.05 + i)*1.5, 0, Math.PI*2);
                ctx.fillStyle = `hsla(${i*18 + 200}, 90%, 70%, 0.5)`;
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }
        animate();

        // Xử lý resize lại các tham số sao (đơn giản hóa)
        window.addEventListener('resize', () => {
            resize();
            // cập nhật lại bán kính cho các ngôi sao màu (không làm mới hoàn toàn, nhưng tạm ổn)
            // do đã dùng % nên không cần cập nhật lại mảng, chỉ cần centerX, centerY mới
        });

    })();
</script>
</body>
</html>
